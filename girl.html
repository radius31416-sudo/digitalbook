        // --- Logic ---

        const container = document.getElementById('story-container');
        const synth = window.speechSynthesis;

        function speakText(text) {
            // Cancel any playing audio first
            synth.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9; // Slightly slower for clarity
            utterance.pitch = 1;
            synth.speak(utterance);
        }

        // Initialize icons
        lucide.createIcons();

        // Render Content
        storyData.forEach((item, index) => {
            // Container for the Sentence Block
            const block = document.createElement('div');
            block.className = 'bg-white/50 border border-transparent rounded-xl p-6 transition-all duration-300 hover:bg-white hover:shadow-lg hover:border-gray-200 group';

            // Top Row: Speaker + Text + Translator
            const topRow = document.createElement('div');
            topRow.className = 'flex items-start gap-4';

            // 1. Start Speaker Icon
            const startBtn = document.createElement('button');
            startBtn.className = 'mt-1 p-2 rounded-full bg-gray-200 text-gray-700 hover:bg-blue-600 hover:text-white transition-colors flex-shrink-0';
            startBtn.innerHTML = '<i data-lucide="volume-2" width="24" height="24"></i>';
            startBtn.onclick = () => speakText(item.fullText);
            
            // 2. Text Content (Phrases)
            const textContent = document.createElement('div');
            textContent.className = 'flex-grow text-2xl md:text-3xl leading-relaxed text-gray-800 font-bold tracking-wide select-none';
            
            item.segments.forEach(seg => {
                const span = document.createElement('span');
                span.className = 'phrase-segment cursor-pointer relative inline-block mx-1 px-1 rounded';
                span.innerText = seg.text;
                
                // Tooltip
                const tooltip = document.createElement('div');
                tooltip.className = 'tooltip-arrow absolute bottom-full left-1/2 transform -translate-x-1/2 mb-3 w-max max-w-[300px] bg-gray-900 text-white text-xl font-bold bengali-text p-3 rounded-lg shadow-xl hidden z-20 pointer-events-none text-center';
                tooltip.innerText = seg.meaning;

                span.appendChild(tooltip);

                // Interaction
                span.onclick = (e) => {
                    e.stopPropagation(); // Prevent bubbling
                    
                    // Reset all other active states
                    document.querySelectorAll('.phrase-segment').forEach(s => s.classList.remove('active'));
                    document.querySelectorAll('.phrase-segment div').forEach(t => t.classList.add('hidden'));

                    // Activate current
                    span.classList.add('active');
                    tooltip.classList.remove('hidden');
                    speakText(seg.text);

                    // Auto hide after 4 seconds
                    setTimeout(() => {
                        span.classList.remove('active');
                        tooltip.classList.add('hidden');
                    }, 4000);
                };

                textContent.appendChild(span);
            });

            // 3. End Language Icon
            const endBtn = document.createElement('button');
            endBtn.className = 'mt-1 p-2 rounded-full bg-gray-200 text-gray-700 hover:bg-green-600 hover:text-white transition-colors flex-shrink-0';
            endBtn.innerHTML = '<i data-lucide="languages" width="24" height="24"></i>';
            
            // 4. Translation Container
            const translationDiv = document.createElement('div');
            translationDiv.className = 'translation-container mt-2';
            const translationText = document.createElement('div');
            translationText.className = 'p-4 bg-gray-800 text-white rounded-lg text-2xl md:text-3xl font-bold bengali-text leading-relaxed shadow-inner border-l-4 border-green-500 mt-4';
            translationText.innerText = item.fullTranslation;
            translationDiv.appendChild(translationText);

            // Toggle Translation Logic
            endBtn.onclick = () => {
                const isOpen = translationDiv.classList.contains('open');
                if (isOpen) {
                    translationDiv.classList.remove('open');
                    endBtn.classList.remove('bg-green-600', 'text-white');
                    endBtn.classList.add('bg-gray-200', 'text-gray-700');
                } else {
                    translationDiv.classList.add('open');
                    endBtn.classList.add('bg-green-600', 'text-white');
                    endBtn.classList.remove('bg-gray-200', 'text-gray-700');
                }
            };

            // Assemble
            topRow.appendChild(startBtn);
            topRow.appendChild(textContent);
            topRow.appendChild(endBtn);
            
            block.appendChild(topRow);
            block.appendChild(translationDiv);
            container.appendChild(block);
        });

        // Re-run icons after DOM generation
        lucide.createIcons();

        // Global click to clear tooltips
        document.addEventListener('click', (e) => {
            if(!e.target.closest('.phrase-segment')) {
                document.querySelectorAll('.phrase-segment').forEach(s => s.classList.remove('active'));
                document.querySelectorAll('.phrase-segment div').forEach(t => t.classList.add('hidden'));
            }
        });
