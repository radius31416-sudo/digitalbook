        // Core Functions
        const synth = window.speechSynthesis;

        function playAudio(text, rate = 0.75) {
            if (synth.speaking) {
                synth.cancel();
            }
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = rate; // Slow reading pace
            synth.speak(utterance);
        }

        function showTooltip(element, text) {
            const tooltip = document.getElementById('tooltip');
            tooltip.innerText = text;
            
            // ব্রাউজার যেন সঠিক উচ্চতা পরিমাপ করতে পারে সেজন্য আগে hidden সরাতে হবে
            tooltip.classList.remove('hidden');
            
            // Positioning above the element
            const rect = element.getBoundingClientRect();
            
            // Calculate absolute top, subtracting tooltip height and spacing
            tooltip.style.top = `${rect.top + window.scrollY - tooltip.offsetHeight - 12}px`;
            
            // Center Horizontally
            let leftPos = rect.left + window.scrollX + (rect.width / 2);
            tooltip.style.left = `${leftPos}px`;

            // ট্রানজিশন ইফেক্টের জন্য একটু সময় দেওয়া
            requestAnimationFrame(() => {
                tooltip.classList.remove('opacity-0');
            });
        }

        function hideTooltip() {
            const tooltip = document.getElementById('tooltip');
            tooltip.classList.add('opacity-0');
            
            // আগের কোন টাইমআউট থাকলে মুছে দেওয়া
            if(tooltip.hideTimeout) clearTimeout(tooltip.hideTimeout);

            tooltip.hideTimeout = setTimeout(() => {
                if(tooltip.classList.contains('opacity-0')){
                    tooltip.classList.add('hidden');
                }
            }, 200); // Wait for transition
        }

        // Hide tooltip on outside click or scroll
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.phrase')) {
                hideTooltip();
            }
        });
        window.addEventListener('scroll', hideTooltip);

        // Rendering Logic
        const container = document.getElementById('content-container');

        function renderSentence(sentenceObj) {
            const sentenceDiv = document.createElement('div');
            sentenceDiv.className = "sentence-wrapper inline-block w-full mb-3";

            // Speaker Icon (Start)
            const speakerBtn = document.createElement('button');
            speakerBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`;
            speakerBtn.className = "mr-3 hover:scale-110 transition-transform cursor-pointer align-middle text-blue-600 inline-flex items-center justify-center -mt-2";
            speakerBtn.title = "Listen to Full Sentence";
            speakerBtn.onclick = () => playAudio(sentenceObj.en, 0.7);
            sentenceDiv.appendChild(speakerBtn);

            // Phrases
            sentenceObj.phrases.forEach((phrase, idx) => {
                const phraseSpan = document.createElement('span');
                phraseSpan.className = "phrase inline-block";
                phraseSpan.innerText = phrase.en + (idx < sentenceObj.phrases.length - 1 ? ' ' : '');
                
                phraseSpan.onclick = (e) => {
                    e.stopPropagation();
                    playAudio(phrase.en, 0.75);
                    showTooltip(phraseSpan, phrase.bn);
                };
                
                sentenceDiv.appendChild(phraseSpan);
            });

            // Translate Icon (End)
            const translateBtn = document.createElement('button');
            translateBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>`;
            translateBtn.className = "ml-3 hover:scale-110 transition-transform cursor-pointer align-middle text-green-600 inline-flex items-center justify-center -mt-2";
            translateBtn.title = "Show Bengali Meaning";
            sentenceDiv.appendChild(translateBtn);

            // Hidden Translation Box
            const translationBox = document.createElement('div');
            translationBox.className = "translation-box bg-indigo-50 border-l-8 border-indigo-500 rounded-r-xl px-6 py-4 shadow-md font-bn font-bold text-3xl text-indigo-900";
            translationBox.innerText = sentenceObj.bn;
            
            // Toggle logic
            translateBtn.onclick = () => {
                translationBox.classList.toggle('active');
            };

            // Wrap everything to ensure layout flow
            const wrapper = document.createElement('div');
            wrapper.className = "mb-2";
            wrapper.appendChild(sentenceDiv);
            wrapper.appendChild(translationBox);

            return wrapper;
        }

        function renderContent() {
            storyData.forEach(block => {
                if (block.type === 'subtitle') {
                    const h3 = document.createElement('h3');
                    h3.className = "text-4xl md:text-5xl font-en font-bold text-teal-800 mt-12 mb-6 border-b-2 border-teal-200 inline-block";
                    h3.innerText = block.en;
                    
                    const subBn = document.createElement('div');
                    subBn.className = "text-3xl font-bn font-bold text-teal-600 mb-6";
                    subBn.innerText = block.bn;

                    container.appendChild(h3);
                    container.appendChild(subBn);
                } 
                else if (block.type === 'paragraph') {
                    const p = document.createElement('p');
                    p.className = "mb-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100";
                    
                    block.sentences.forEach(sentence => {
                        p.appendChild(renderSentence(sentence));
                    });
                    
                    container.appendChild(p);
                }
                else if (block.type === 'list') {
                    const ul = document.createElement('ul');
                    ul.className = "list-none mb-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 pl-8 space-y-4";
                    
                    block.items.forEach(item => {
                        const li = document.createElement('li');
                        li.className = "flex items-start";
                        
                        const bullet = document.createElement('span');
                        bullet.className = "text-teal-500 mr-4 font-bold text-4xl leading-none";
                        bullet.innerHTML = "&bull;";
                        li.appendChild(bullet);

                        const contentWrap = document.createElement('div');
                        contentWrap.className = "flex-1";
                        contentWrap.appendChild(renderSentence(item));

                        li.appendChild(contentWrap);
                        ul.appendChild(li);
                    });
                    
                    container.appendChild(ul);
                }
            });
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', renderContent);

    </script>
