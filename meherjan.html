                speakerBtn.className = 'mt-1 flex-shrink-0 focus:outline-none focus:ring-2 focus:ring-blue-400 rounded-full';
                speakerBtn.title = "Listen to full sentence";
                speakerBtn.onclick = () => speak(item.fullText);
                
                // 2. Text Area (Phrases)
                const textWrapper = document.createElement('div');
                textWrapper.className = 'flex-grow text-2xl md:text-3xl leading-relaxed font-bold text-gray-800';
                
                // Build phrase spans
                item.segments.forEach((segment, segIndex) => {
                    // Wrapper for relative positioning of tooltip
                    const phraseSpan = document.createElement('span');
                    phraseSpan.className = 'relative inline-block cursor-pointer px-1 mx-0.5 rounded transition duration-200 hover:bg-yellow-200 hover:text-black border-b-2 border-transparent hover:border-yellow-500';
                    phraseSpan.textContent = segment.en + ' '; // Add space for natural flow
                    
                    // Tooltip Logic
                    const tooltipId = `tooltip-${item.id}-${segIndex}`;
                    
                    const tooltip = document.createElement('div');
                    tooltip.id = tooltipId;
                    tooltip.className = 'absolute bottom-full left-1/2 transform -translate-x-1/2 mb-3 w-max max-w-[250px] bg-gray-800 text-white text-lg font-bengali font-bold py-2 px-4 rounded-lg shadow-xl z-50 hidden pointer-events-none';
                    tooltip.innerHTML = `
                        ${segment.bn}
                        <div class="tooltip-arrow"></div>
                    `;

                    // Interaction: Click Phrase
                    phraseSpan.onclick = (e) => {
                        e.stopPropagation();
                        
                        // Speak logic
                        speak(segment.en);
                        
                        // Toggle Tooltip
                        const allTooltips = document.querySelectorAll('[id^="tooltip-"]');
                        allTooltips.forEach(t => {
                            if(t.id !== tooltipId) t.classList.add('hidden');
                        });
                        
                        tooltip.classList.remove('hidden');
                        currentTooltipId = tooltipId;
                    };

                    phraseSpan.appendChild(tooltip);
                    textWrapper.appendChild(phraseSpan);
                });

                // 3. Language Icon (End)
                const transBtn = document.createElement('button');
                transBtn.innerHTML = icons.translate;
                transBtn.className = 'mt-1 flex-shrink-0 focus:outline-none focus:ring-2 focus:ring-emerald-400 rounded-full';
                transBtn.title = "Show full translation";
                
                // 4. Translation Container (Hidden by default)
                const transBox = document.createElement('div');
                transBox.className = 'translation-content w-full bg-emerald-50 border-l-4 border-emerald-500 rounded-r-lg';
                transBox.innerHTML = `
                    <p class="font-bengali text-2xl md:text-3xl font-bold text-emerald-900 py-4 px-6 leading-relaxed">
                        ${item.translation}
                    </p>
                `;

                // Toggle Translation Logic
                transBtn.onclick = () => {
                    transBox.classList.toggle('active');
                };

                // Append elements
                row.appendChild(speakerBtn);
                row.appendChild(textWrapper);
                row.appendChild(transBtn);
                
                sentenceContainer.appendChild(row);
                sentenceContainer.appendChild(transBox);
                
                app.appendChild(sentenceContainer);
            });
        }

        // --- Initialization ---
        
        // Close tooltips when clicking anywhere else
        document.addEventListener('click', (e) => {
            if (currentTooltipId) {
                const activeTooltip = document.getElementById(currentTooltipId);
                // If click is not inside the active tooltip's parent span
                if (activeTooltip && !activeTooltip.parentElement.contains(e.target)) {
                    activeTooltip.classList.add('hidden');
                    currentTooltipId = null;
                }
            }
        });

        // Initialize
        renderStory();

    </script>
</body>
</html>
